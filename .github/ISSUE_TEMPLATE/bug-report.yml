name: Bug report
description: Something on the site is broken, looks wrong, or doesn't work.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: And what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Tap …
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: iPhone 15, Safari / Windows, Chrome 130
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
